    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
      :root {
        --green: #16A34A;
        --green-hover: #14853D;
        --yellow: #F6C64D;
        --text: #1F2937;
        --text-sub: #6B7280;
        --bg: #F3F6F2;
        --card: #FFFFFF;
        --border: #E4E7E4;
      }
      body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
      input, textarea, select, button { font-family: 'Plus Jakarta Sans', sans-serif; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

      /* Animações globais */
      .card-lift { transition: all 0.25s ease; }
      .card-lift:hover { transform: translateY(-4px); box-shadow: 0 18px 45px rgba(0,0,0,0.10) !important; }
      .btn-press { transition: all 0.25s ease; cursor: pointer; }
      .btn-press:hover { transform: translateY(-2px); }
      .btn-press:active { transform: scale(0.97); }

      @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
      .skeleton { background: linear-gradient(90deg, #F1F5F9 25%, #E9EEFA 50%, #F1F5F9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }

      @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      .fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/service-worker.js').catch(()=>{})})}</script>
  </body>
</html>
